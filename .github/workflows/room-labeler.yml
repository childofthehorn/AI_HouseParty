name: room labeler

# Labels every PR with the room of each file it changes (.github/house/rooms.config.js).
# Room labels are bot-owned: added when a room is touched, removed when it no longer is.
# Safe-room is added by path or by hand, and never removed here.
#
# pull_request_target so the token can label fork PRs. Safe because only the
# BASE commit's .github/house is checked out; PR code is never checked out or run.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: room-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/house
          persist-credentials: false

      - uses: actions/github-script@v9
        with:
          script: |
            const house = require(`${process.env.GITHUB_WORKSPACE}/.github/house/house.js`);
            const config = require(`${process.env.GITHUB_WORKSPACE}/.github/house/rooms.config.js`);
            await house.runLabeler({ github, context, core }, config);
