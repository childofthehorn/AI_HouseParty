name: secret scan

# Pre-commit only is a screen door. This is the CI half — you need both.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # The job id is a required check context (scripts/branch-protection.sh); keep it.
  mobile_specific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Look for the classics (mobile, web, JVM)
        run: |
          set -euo pipefail
          PATTERNS='(ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|sk_live_[0-9A-Za-z]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          # keystore passwords, plist secrets, hardcoded base URLs pointing at prod
          if grep -rInE "$PATTERNS" --include='*.kt' --include='*.kts' --include='*.java' \
               --include='*.swift' --include='*.plist' --include='*.xml' \
               --include='*.properties' --include='*.json' --include='*.yml' --include='*.yaml' \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
               --include='*.mjs' --include='*.cjs' --exclude-dir=node_modules . ; then
            echo "::error::Possible secret committed. Rotate it, then remove it from history."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(google-services\.json|GoogleService-Info\.plist|.*\.jks|.*\.keystore|.*\.p12|.*\.mobileprovision)$'; then
            echo "::error::Signing material or service config is tracked in git."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env(\.[A-Za-z0-9_-]+)?$' | grep -vE '\.env\.(example|sample|template)$'; then
            echo "::error::.env file tracked in git. Commit a .env.example and keep the real one local."
            exit 1
          fi
          # Capture, then test: `xargs -r` with no input exits 0, which an `if` would read as a hit.
          NPMRC_HITS=$(git ls-files -z '*.npmrc' | xargs -0 -r grep -HnE '_authToken=["'"'"']?[^$"'"'"']' || true)
          if [ -n "$NPMRC_HITS" ]; then
            printf '%s\n' "$NPMRC_HITS"
            echo "::error::Literal registry token in .npmrc. Use \${NPM_TOKEN} and a CI secret."
            exit 1
          fi
