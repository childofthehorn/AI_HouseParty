name: android quality

# Machines check mechanical things. Humans review intent.
# Lint, static analysis, unit tests and the Kotlin house rules run in jvm-quality.yml.
on:
  pull_request:
    paths: ["**/*.kt", "**/*.kts", "gradle/**", "composeApp/**", "androidApp/**", "core/**", "feature/**", "shared/**"]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      # Full history: the diff below needs the merge base with the base branch.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6

      - name: Reject formatting-only churn in a feature PR
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" -- '*.kt' | wc -l)
          SUBSTANTIVE=$(git diff -U0 "origin/$BASE_REF...HEAD" -- '*.kt' \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
            | grep -cvE '^[+-]\s*$' || true)
          echo "changed files: $CHANGED, changed lines: $SUBSTANTIVE"
          # Informational only: large diffs across many files with no test changes are suspicious.
          TEST_CHANGES=$(git diff --name-only "origin/$BASE_REF...HEAD" -- '*src/test*')
          if [ "$CHANGED" -gt 40 ] && [ -z "$TEST_CHANGES" ]; then
            echo "::warning::Large Kotlin diff with no test changes. Reviewer: check this is really mechanical."
          fi

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and report size
        run: |
          ./gradlew --no-daemon assembleRelease -x lint || ./gradlew --no-daemon assembleDebug
          find . -name '*.apk' -o -name '*.aab' | while read -r f; do
            echo "$f: $(du -h "$f" | cut -f1)"
          done
      # FILL IN: compare against the base branch artifact and post a delta comment.
