name: room cleanliness

# Fails the PR unless its description ticks every room the diff touches
# (one or several), Safe-room matches its label, and Driveway has an expiry.
# Runs on description edits and label changes, so fixing the body re-runs it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: room-cleanliness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rooms-declared:
    runs-on: ubuntu-latest
    steps:
      # merge_group has no pull_request payload; the check already ran on the PR.
      - if: github.event_name == 'merge_group'
        run: echo "Rooms were checked on the PR."

      # Rules come from the base commit so a PR cannot edit its own map.
      - if: github.event_name != 'merge_group'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/house
          persist-credentials: false

      - if: github.event_name != 'merge_group'
        uses: actions/github-script@v9
        with:
          script: |
            const house = require(`${process.env.GITHUB_WORKSPACE}/.github/house/house.js`);
            const config = require(`${process.env.GITHUB_WORKSPACE}/.github/house/rooms.config.js`);
            await house.runCleanliness({ github, context, core }, config);
