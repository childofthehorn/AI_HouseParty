# Labels the workflows depend on. Apply with scripts/setup-labels.sh.
# The room labels (kitchen, living-room, garage, driveway, safe-room) are not
# here: the room labeler creates and colors them from .github/house/rooms.config.js.
- name: driveway-sweep
  color: "BFD4F2"
  description: "Driveway tow PR opened by the sweep"
- name: chore/format
  color: "EDEDED"
  description: "Formatting only; no behaviour change"
- name: ai-generated
  color: "D4C5F9"
  description: "Majority of the diff was model-generated"
