<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ page.title | escape }} · {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4 3 15h4v12h7v-8h4v8h7V15h4z' fill='%23EE2B37'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script type="module" src="{{ '/assets/site.js' | relative_url }}"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="site-header__brand">
      <p class="eyebrow">Hosting the AI Slop Party</p>
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="site-tagline">{{ site.description }}</p>
    </div>
    <a class="site-source" href="https://github.com/{{ site.repository }}">Source on GitHub</a>
  </header>

  <nav class="site-nav" aria-label="Site">
    <ul>
      {% for item in site.nav %}
      <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>

  <main id="content">{{ content }}</main>

  <footer class="site-footer">
    <p><a href="https://github.com/{{ site.repository }}">{{ site.repository }}</a></p>
    <p>Built from the repository's own markdown by GitHub Pages. Shoes off. Apron on.</p>
  </footer>
</body>
</html>
