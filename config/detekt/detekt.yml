# detekt: only rules we will actually enforce. A config nobody reads is decoration.
# Run: ./gradlew detekt   |   Baseline first on an existing codebase: ./gradlew detektBaseline
build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true

comments:
  active: true
  UndocumentedPublicClass:
    active: false        # entry points only, not everything
  UndocumentedPublicFunction:
    active: false

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 7
    constructorThreshold: 9
    ignoreAnnotated: ['Composable', 'Inject']
  TooManyFunctions:
    active: true
    thresholdInClasses: 20
    ignoreAnnotatedFunctions: ['Composable']
  CyclomaticComplexMethod:
    active: true
    threshold: 15

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true         # no GlobalScope
  InjectDispatcher:
    active: true         # dispatchers injected, never hardcoded
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunSwallowedCancellation:
    active: true

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  PrintStackTrace:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    active: true

performance:
  active: true
  SpreadOperator:
    active: false

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true         # this is the !! rule
  UnsafeCast:
    active: true
  LateinitUsage:
    active: true
    ignoreAnnotated: ['Inject', 'Before', 'BeforeEach']
  ImplicitDefaultLocale:
    active: true
  CastNullableToNonNullableType:
    active: true

style:
  active: true
  ForbiddenComment:
    active: true
    comments:
      - value: 'FIXME:'
        reason: 'Open an issue instead; FIXME rots.'
      - value: 'STOPSHIP:'
        reason: 'Do not ship this.'
  MagicNumber:
    active: true
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludeCommentStatements: true
  ReturnCount:
    active: true
    max: 4
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: true
  UseCheckOrError:
    active: true
  UseRequire:
    active: true
  ThrowsCount:
    active: true
